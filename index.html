      const QUESTIONS = [

      function RadioGroup({ name, value, onChange, options }) {

                  value={opt.value}

                <span>{opt.label}</span>
              </label>
            ))}
          </div>
        );

      function CheckboxGroup({ values, onToggle, options }) {
        return (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {options.map((opt) => {
              const checked = values.includes(opt.value);
              return (
                <label
                  key={opt.value}
                  style={{
                    display: "inline-flex",
                    alignItems: "center",
                    gap: 8,
                    cursor: "pointer",
                    border: `1px solid ${
                      checked ? SCHOOL_COLORS.primary : "#e5e7eb"
                    }`,
                    borderRadius: 999,
                    padding: "8px 12px",
                    background: checked ? "#eef2ff" : "white",
                    color: checked ? SCHOOL_COLORS.primary : "inherit",
                  }}

                  <input
                    type="checkbox"
                    checked={checked}
                    onChange={() => onToggle(opt.value)}

                  <span>{opt.label}</span>
                </label>
              );
            })}

      // ─── DECA COMPONENTS ─────────────────────────────────────────────────────────

      function useScores(answers) {
        return useMemo(() => {
          const scores = Object.fromEntries(EVENTS.map((e) => [e.code, 0]));

          const add = (predicate, amount = 1) => {
            EVENTS.forEach((e) => {
              if (predicate(e)) scores[e.code] += amount;
            });
          };

          if (answers.experience === "first") {
            add((e) => has(e, "principles"), 6);
            add((e) => !has(e, "principles"), 0.5);
          } else if (answers.experience) {
            add((e) => has(e, "principles"), -4);
          }

          if (answers.focus) {
            add((e) => has(e, answers.focus), 5);
          }

          if (answers.team === "team") add((e) => has(e, "team"), 4);
          if (answers.team === "solo") add((e) => has(e, "solo"), 4);
          if (answers.team === "either") add(() => true, 0.5);

          switch (answers.style) {
            case "roleplay":
              add((e) => has(e, "roleplay"), 4);
              add((e) => has(e, "exam"), 2);
              break;
            case "written":
              add((e) => has(e, "written") || has(e, "project"), 5);
              break;
            case "sales":
              add((e) => has(e, "sales") || has(e, "consulting"), 6);
              break;
            case "mix":
              add(() => true, 1.2);
              break;
            default:
              break;
          }

          if (answers.mathComfort === "high")
            add((e) => has(e, "math") || has(e, "finance"), 3);
          if (answers.mathComfort === "med") add((e) => has(e, "math"), 1);
          if (answers.mathComfort === "low") add((e) => has(e, "math"), -2);

          if (answers.time === "low")
            add((e) => has(e, "roleplay") && has(e, "exam"), 2);
          if (answers.time === "medium") add((e) => has(e, "project"), 1.5);
          if (answers.time === "high")
            add((e) => has(e, "written") || has(e, "project"), 3);

          const interests = answers.interests || [];
          const interestMap = {
            sports: (e) =>
              e.code === "SEM" || e.code === "STDM" || has(e, "marketing"),
            fashion: (e) => e.code === "AAP",
            food: (e) =>
              e.code === "RFSM" ||
              e.code === "QSRM" ||
              e.code === "FMS" ||
              has(e, "hospitality"),
            autos: (e) => e.code === "ASM",
            law: (e) => e.code === "BLTDM",
            hr: (e) => e.code === "HRM",
            travel: (e) =>
              e.code === "TTDM" || e.code === "HLM" || has(e, "hospitality"),
            retail: (e) => e.code === "RMS" || e.code === "BTDM",
          };

          interests.forEach((i) => {
            const matcher = interestMap[i];
            if (matcher) add(matcher, 2);
          });

          if (answers.focus === "entrepreneurship")
            add((e) => has(e, "entrepreneurship"), 2);

          return scores;
        }, [answers]);
      }

      function Results({ answers }) {
        const scores = useScores(answers);
        const ranked = useMemo(() => {
          const list = EVENTS.map((e) => ({ ...e, score: scores[e.code] })).sort(
            (a, b) => b.score - a.score
          );

          const filtered = list.filter((e) => {
            if (has(e, "principles") && answers.experience !== "first")
              return false;
            return true;
          });

          return filtered.slice(0, 10);
        }, [scores, answers]);

        if (!answers.experience) return null;

        return (
          <div>
            <SectionTitle>Top Recommendations</SectionTitle>
            <div style={{ display: "grid", gap: 12 }}>
              {ranked.map((e, idx) => (
                <Card key={e.code}>
                  <div
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "baseline",
                      gap: 12,
                      flexWrap: "wrap",
                    }}

                    <div>
                      <div style={{ fontWeight: 900, fontSize: 16 }}>
                        {idx + 1}. {e.name}{" "}
                        <span style={{ opacity: 0.6 }}>({e.code})</span>
                      </div>
                      <div style={{ marginTop: 6, opacity: 0.85 }}>
                        {e.desc}
                      </div>
                      <div style={{ marginTop: 10 }}>
                        {e.tags.slice(0, 6).map((t) => (
                          <Pill key={t}>{t}</Pill>
                        ))}
                      </div>
                    </div>
                    <div
                      style={{
                        fontSize: 12,
                        color: SCHOOL_COLORS.success,
                        fontWeight: 800,
                      }}
                    >
                      Fit score: {e.score.toFixed(1)}
                    </div>
                  </div>
                </Card>
              ))}

            <details style={{ marginTop: 16 }}>
              <summary
                style={{
                  cursor: "pointer",
                  color: SCHOOL_COLORS.primary,
                  fontWeight: 700,
                }}
              >
                Why these picks?
              </summary>
              <div style={{ marginTop: 8, opacity: 0.9 }}>
                We scored each event using your answers about focus (e.g.,
                marketing vs. finance), team vs. solo, preferred style
                (role-play/written/sales), math comfort, expected prep time, and
                interests. You can tweak choices to see the list update
                instantly.
              </div>
            </details>
          </div>
        );
      }

      function DecaTab({ logoUrl, setLogoUrl }) {
        const [answers, setAnswers] = useState({
          experience: "",
          focus: "",
          team: "",
          style: "",
          mathComfort: "",
          time: "",
          interests: [],
        });

        const handleChange = (key, value) =>
          setAnswers((a) => ({ ...a, [key]: value }));

        const toggleInterest = (value) =>
          setAnswers((a) => {
            const set = new Set(a.interests);
            set.has(value) ? set.delete(value) : set.add(value);
            return { ...a, interests: Array.from(set) };
          });

        const allRequiredAnswered = useMemo(() => {
          return QUESTIONS.filter((q) => q.required).every((q) => {
            const v = answers[q.key];
            return Array.isArray(v) ? v.length > 0 : Boolean(v);
          });
        }, [answers]);

        const reset = () => {
          setAnswers({
            experience: "",
            focus: "",
            team: "",
            style: "",
            mathComfort: "",
            time: "",
            interests: [],
          });
        };

        return (
          <div>
            <Card style={{ marginTop: 12 }}>
              <SectionTitle>Customize Look (optional)</SectionTitle>
              <div style={{ display: "grid", gap: 8 }}>
                <Label>School/Chapter Logo URL</Label>
                <input
                  type="url"
                  placeholder="Paste a logo image URL (PNG/JPG)"
                  value={logoUrl}
                  onChange={(e) => setLogoUrl(e.target.value)}
                  style={{
                    padding: 12,
                    borderRadius: 12,
                    border: "1px solid #e5e7eb",
                    outline: "none",
                  }}
                />
              </div>
            </Card>

            <div style={{ height: 8 }} />

            <Card>
              <SectionTitle>Your Preferences</SectionTitle>
              <div style={{ display: "grid", gap: 18 }}>
                {QUESTIONS.map((q) => (
                  <div key={q.key}>
                    <Label>{q.label}</Label>
                    {q.type === "radio" && (
                      <RadioGroup
                        name={q.key}
                        value={answers[q.key]}
                        onChange={(v) => handleChange(q.key, v)}
                        options={q.options}
                      />
                    )}
                    {q.type === "checkbox" && (
                      <CheckboxGroup
                        values={answers[q.key]}
                        onToggle={toggleInterest}
                        options={q.options}
                      />
                    )}
                  </div>
                ))}

                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <button
                    onClick={reset}
                    style={{
                      background: "white",
                      color: SCHOOL_COLORS.primary,
                      border: `2px solid ${SCHOOL_COLORS.primary}`,
                      padding: "10px 14px",
                      borderRadius: 12,
                      fontWeight: 800,
                      cursor: "pointer",
                    }}
                  >
                    Reset
                  </button>

                  <button
                    disabled={!allRequiredAnswered}
                    onClick={() =>
                      window.scrollTo({
                        top: document.body.scrollHeight,
                        behavior: "smooth",
                      })
                    }
                    style={{
                      background: allRequiredAnswered
                        ? SCHOOL_COLORS.primary
                        : "#93c5fd",
                      color: "white",
                      border: "none",
                      padding: "10px 14px",
                      borderRadius: 12,
                      fontWeight: 800,
                      cursor: allRequiredAnswered ? "pointer" : "not-allowed",
                    }}
                  >
                    Show my matches
                  </button>
                </div>
              </div>
            </Card>

            <div style={{ height: 12 }} />

            <Results answers={answers} />

            <div
              style={{
                padding: 20,
                textAlign: "center",
                opacity: 0.6,
                fontSize: 12,
              }}
            >
              Tip: If you're not a first-year member, Principles events are
              hidden automatically.
            </div>
          </div>
        );
      }

      // ─── STOCK WATCHLIST ─────────────────────────────────────────────────────────

      const HORIZON_LABELS = {
        short: "Short-term (< 1 yr)",
        medium: "Medium-term (1–3 yr)",
        long: "Long-term (3+ yr)",
      };

      const CONFIDENCE_COLORS = {
        low: SCHOOL_COLORS.warning,
        medium: SCHOOL_COLORS.primaryLight,
        high: SCHOOL_COLORS.green,
      };

      const CONFIDENCE_LABELS = {
        low: "Low confidence",
        medium: "Medium confidence",
        high: "High confidence",
      };

      const EMPTY_FORM = {
        ticker: "",
        company: "",
        expectedReturn: "",
        horizon: "medium",
        confidence: "medium",
        thesis: "",
        targetPrice: "",
        entryPrice: "",
      };

      function returnColor(pct) {
        const n = parseFloat(pct);
        if (n >= 50) return "#16a34a";
        if (n >= 20) return "#059669";
        if (n >= 10) return "#0891b2";
        if (n >= 0) return SCHOOL_COLORS.primaryLight;
        return SCHOOL_COLORS.danger;
      }

      function StatBox({ label, value, color }) {
        return (
          <div
            style={{
              background: "#f0f4ff",
              borderRadius: 12,
              padding: "12px 16px",
              flex: "1 1 120px",
              minWidth: 100,
            }}
          >
            <div style={{ fontSize: 11, opacity: 0.7, marginBottom: 4 }}>
              {label}
            </div>
            <div
              style={{
                fontSize: 22,
                fontWeight: 900,
                color: color || SCHOOL_COLORS.primary,
              }}
            >
              {value}
            </div>
          </div>
        );
      }

      function AddStockForm({ onAdd }) {
        const [form, setForm] = useState(EMPTY_FORM);
        const [error, setError] = useState("");

        const set = (key, val) => setForm((f) => ({ ...f, [key]: val }));

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!form.ticker.trim()) {
            setError("Ticker symbol is required.");
            return;
          }
          if (!form.company.trim()) {
            setError("Company name is required.");
            return;
          }
          if (form.expectedReturn === "" || isNaN(Number(form.expectedReturn))) {
            setError("Expected return must be a number.");
            return;
          }
          setError("");
          onAdd({
            ...form,
            ticker: form.ticker.toUpperCase().trim(),
            company: form.company.trim(),
            expectedReturn: parseFloat(form.expectedReturn),
            targetPrice: form.targetPrice ? parseFloat(form.targetPrice) : null,
            entryPrice: form.entryPrice ? parseFloat(form.entryPrice) : null,
            id: Date.now(),
            addedDate: new Date().toISOString().slice(0, 10),
          });
          setForm(EMPTY_FORM);
        };

        const inputStyle = {
          padding: "10px 12px",
          borderRadius: 10,
          border: "1px solid #e5e7eb",
          outline: "none",
          fontSize: 14,
          width: "100%",
          boxSizing: "border-box",
        };

        const selectStyle = {
          ...inputStyle,
          background: "white",
          cursor: "pointer",
        };

        return (
          <form onSubmit={handleSubmit}>
            <SectionTitle>Add a Stock</SectionTitle>

            {error && (
              <div
                style={{
                  background: "#fef2f2",
                  color: SCHOOL_COLORS.danger,
                  border: "1px solid #fecaca",
                  borderRadius: 10,
                  padding: "10px 14px",
                  marginBottom: 12,
                  fontSize: 14,
                }}
              >
                {error}
              </div>
            )}

            <div style={{ display: "grid", gap: 12 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 12 }}>
                <div>
                  <Label>Ticker Symbol *</Label>
                  <input
                    style={{ ...inputStyle, textTransform: "uppercase" }}
                    placeholder="e.g. AAPL"
                    value={form.ticker}
                    onChange={(e) => set("ticker", e.target.value)}
                    maxLength={10}
                  />
                </div>
                <div>
                  <Label>Company Name *</Label>
                  <input
                    style={inputStyle}
                    placeholder="e.g. Apple Inc."
                    value={form.company}
                    onChange={(e) => set("company", e.target.value)}
                  />
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
                <div>
                  <Label>Expected Return (%) *</Label>
                  <input
                    style={inputStyle}
                    type="number"
                    placeholder="e.g. 35"
                    value={form.expectedReturn}
                    onChange={(e) => set("expectedReturn", e.target.value)}
                  />
                </div>
                <div>
                  <Label>Entry Price ($)</Label>
                  <input
                    style={inputStyle}
                    type="number"
                    placeholder="Optional"
                    value={form.entryPrice}
                    onChange={(e) => set("entryPrice", e.target.value)}
                    min="0"
                    step="0.01"
                  />
                </div>
                <div>
                  <Label>Target Price ($)</Label>
                  <input
                    style={inputStyle}
                    type="number"
                    placeholder="Optional"
                    value={form.targetPrice}
                    onChange={(e) => set("targetPrice", e.target.value)}
                    min="0"
                    step="0.01"
                  />
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <div>
                  <Label>Time Horizon</Label>
                  <select
                    style={selectStyle}
                    value={form.horizon}
                    onChange={(e) => set("horizon", e.target.value)}
                  >
                    <option value="short">Short-term (&lt; 1 yr)</option>
                    <option value="medium">Medium-term (1–3 yr)</option>
                    <option value="long">Long-term (3+ yr)</option>
                  </select>
                </div>
                <div>
                  <Label>Confidence Level</Label>
                  <select
                    style={selectStyle}
                    value={form.confidence}
                    onChange={(e) => set("confidence", e.target.value)}
                  >
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                  </select>
                </div>
              </div>

              <div>
                <Label>Investment Thesis</Label>
                <textarea
                  style={{
                    ...inputStyle,
                    minHeight: 80,
                    resize: "vertical",
                    fontFamily: "inherit",
                  }}
                  placeholder="Why do you believe this stock will have a high return? (e.g. strong earnings growth, undervalued relative to peers, upcoming catalyst...)"
                  value={form.thesis}
                  onChange={(e) => set("thesis", e.target.value)}
                />
              </div>

              <button
                type="submit"
                style={{
                  background: SCHOOL_COLORS.primary,
                  color: "white",
                  border: "none",
                  padding: "12px 20px",
                  borderRadius: 12,
                  fontWeight: 800,
                  cursor: "pointer",
                  fontSize: 15,
                  alignSelf: "start",
                }}
              >
                + Add to Watchlist
              </button>
            </div>
          </form>
        );
      }

      function StockCard({ stock, onRemove }) {
        const [expanded, setExpanded] = useState(false);
        const retColor = returnColor(stock.expectedReturn);
        const confColor = CONFIDENCE_COLORS[stock.confidence];

        const impliedReturn =
          stock.entryPrice && stock.targetPrice
            ? (((stock.targetPrice - stock.entryPrice) / stock.entryPrice) * 100).toFixed(1)
            : null;

        return (
          <Card
            style={{
              borderLeft: `4px solid ${retColor}`,
              transition: "box-shadow 0.15s",
            }}
          >
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "flex-start",
                gap: 12,
                flexWrap: "wrap",
              }}
            >
              <div style={{ flex: 1 }}>
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    flexWrap: "wrap",
                  }}
                >
                  <span
                    style={{
                      fontWeight: 900,
                      fontSize: 20,
                      color: SCHOOL_COLORS.primary,
                      letterSpacing: 0.5,
                    }}
                  >
                    {stock.ticker}
                  </span>
                  <span style={{ fontWeight: 600, opacity: 0.8 }}>
                    {stock.company}
                  </span>
                </div>

                <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 4 }}>
                  <Pill color={retColor}>
                    {stock.expectedReturn > 0 ? "+" : ""}
                    {stock.expectedReturn}% expected
                  </Pill>
                  <Pill color={confColor}>
                    {CONFIDENCE_LABELS[stock.confidence]}
                  </Pill>
                  <Pill>{HORIZON_LABELS[stock.horizon]}</Pill>
                  {impliedReturn !== null && (
                    <Pill color={returnColor(impliedReturn)}>
                      {impliedReturn > 0 ? "+" : ""}
                      {impliedReturn}% price target implied
                    </Pill>
                  )}
                </div>

                {stock.entryPrice && (
                  <div style={{ fontSize: 13, opacity: 0.7, marginTop: 6 }}>
                    Entry: ${stock.entryPrice.toFixed(2)}
                    {stock.targetPrice && (
                      <> &rarr; Target: ${stock.targetPrice.toFixed(2)}</>
                    )}
                  </div>
                )}

                {stock.thesis && (
                  <div style={{ marginTop: 10 }}>
                    <button
                      onClick={() => setExpanded((x) => !x)}
                      style={{
                        background: "none",
                        border: "none",
                        color: SCHOOL_COLORS.primaryLight,
                        cursor: "pointer",
                        fontWeight: 700,
                        fontSize: 13,
                        padding: 0,
                      }}
                    >
                      {expanded ? "Hide thesis ▲" : "Show thesis ▼"}
                    </button>
                    {expanded && (
                      <div
                        style={{
                          marginTop: 8,
                          padding: "10px 14px",
                          background: "#f8fafc",
                          borderRadius: 10,
                          fontSize: 14,
                          lineHeight: 1.6,
                          borderLeft: `3px solid ${retColor}`,
                        }}
                      >
                        {stock.thesis}
                      </div>
                    )}
                  </div>
                )}
              </div>

              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "flex-end",
                  gap: 6,
                }}
              >
                <div
                  style={{
                    fontSize: 28,
                    fontWeight: 900,
                    color: retColor,
                    lineHeight: 1,
                  }}
                >
                  {stock.expectedReturn > 0 ? "+" : ""}
                  {stock.expectedReturn}%
                </div>
                <div style={{ fontSize: 11, opacity: 0.5 }}>
                  Added {stock.addedDate}
                </div>
                <button
                  onClick={() => onRemove(stock.id)}
                  style={{
                    background: "none",
                    border: "1px solid #e5e7eb",
                    color: "#9ca3af",
                    borderRadius: 8,
                    padding: "4px 10px",
                    cursor: "pointer",
                    fontSize: 12,
                    marginTop: 4,
                  }}
                >
                  Remove
                </button>
              </div>
            </div>
          </Card>
        );
      }

      function StockWatchlist() {
        const [stocks, setStocks] = useState(() => {
          try {
            const saved = localStorage.getItem("highReturnWatchlist");
            return saved ? JSON.parse(saved) : [];
          } catch {
            return [];
          }
        });

        const [sortBy, setSortBy] = useState("expectedReturn");
        const [filterHorizon, setFilterHorizon] = useState("all");
        const [filterConfidence, setFilterConfidence] = useState("all");

        useEffect(() => {
          try {
            localStorage.setItem("highReturnWatchlist", JSON.stringify(stocks));
          } catch {}
        }, [stocks]);

        const addStock = (stock) => setStocks((s) => [stock, ...s]);
        const removeStock = (id) => setStocks((s) => s.filter((x) => x.id !== id));

        const filtered = useMemo(() => {
          let list = [...stocks];
          if (filterHorizon !== "all")
            list = list.filter((s) => s.horizon === filterHorizon);
          if (filterConfidence !== "all")
            list = list.filter((s) => s.confidence === filterConfidence);

          list.sort((a, b) => {
            if (sortBy === "expectedReturn") return b.expectedReturn - a.expectedReturn;
            if (sortBy === "confidence") {
              const order = { high: 3, medium: 2, low: 1 };
              return order[b.confidence] - order[a.confidence];
            }
            if (sortBy === "date") return b.id - a.id;
            return 0;
          });
          return list;
        }, [stocks, sortBy, filterHorizon, filterConfidence]);

        const avgReturn = useMemo(() => {
          if (!stocks.length) return null;
          const sum = stocks.reduce((acc, s) => acc + s.expectedReturn, 0);
          return (sum / stocks.length).toFixed(1);
        }, [stocks]);

        const maxReturn = useMemo(() => {
          if (!stocks.length) return null;
          return Math.max(...stocks.map((s) => s.expectedReturn));
        }, [stocks]);

        const highConfCount = stocks.filter((s) => s.confidence === "high").length;

        const controlStyle = {
          padding: "8px 12px",
          borderRadius: 10,
          border: "1px solid #e5e7eb",
          background: "white",
          fontSize: 13,
          cursor: "pointer",
          outline: "none",
        };

        return (
          <div>
            <Card style={{ marginTop: 12 }}>
              <AddStockForm onAdd={addStock} />
            </Card>

            {stocks.length > 0 && (
              <>
                <Card style={{ marginTop: 12 }}>
                  <SectionTitle>Portfolio Overview</SectionTitle>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                    <StatBox label="Stocks Watched" value={stocks.length} />
                    <StatBox
                      label="Avg Expected Return"
                      value={`+${avgReturn}%`}
                      color={returnColor(avgReturn)}
                    />
                    <StatBox
                      label="Highest Expected"
                      value={`+${maxReturn}%`}
                      color={returnColor(maxReturn)}
                    />
                    <StatBox
                      label="High Confidence"
                      value={highConfCount}
                      color={SCHOOL_COLORS.green}
                    />
                  </div>
                </Card>

                <div style={{ marginTop: 12 }}>
                  <div
                    style={{
                      display: "flex",
                      gap: 10,
                      alignItems: "center",
                      flexWrap: "wrap",
                      marginBottom: 12,
                    }}
                  >
                    <span style={{ fontWeight: 700, fontSize: 14 }}>Sort:</span>
                    <select
                      style={controlStyle}
                      value={sortBy}
                      onChange={(e) => setSortBy(e.target.value)}
                    >
                      <option value="expectedReturn">Expected Return (high → low)</option>
                      <option value="confidence">Confidence</option>
                      <option value="date">Date Added (newest first)</option>
                    </select>

                    <span style={{ fontWeight: 700, fontSize: 14, marginLeft: 8 }}>
                      Horizon:
                    </span>
                    <select
                      style={controlStyle}
                      value={filterHorizon}
                      onChange={(e) => setFilterHorizon(e.target.value)}
                    >
                      <option value="all">All</option>
                      <option value="short">Short-term</option>
                      <option value="medium">Medium-term</option>
                      <option value="long">Long-term</option>
                    </select>

                    <span style={{ fontWeight: 700, fontSize: 14, marginLeft: 8 }}>
                      Confidence:
                    </span>
                    <select
                      style={controlStyle}
                      value={filterConfidence}
                      onChange={(e) => setFilterConfidence(e.target.value)}
                    >
                      <option value="all">All</option>
                      <option value="high">High</option>
                      <option value="medium">Medium</option>
                      <option value="low">Low</option>
                    </select>

                    <span style={{ fontSize: 13, opacity: 0.6, marginLeft: "auto" }}>
                      {filtered.length} of {stocks.length} showing
                    </span>
                  </div>

                  <div style={{ display: "grid", gap: 12 }}>
                    {filtered.map((stock) => (
                      <StockCard key={stock.id} stock={stock} onRemove={removeStock} />
                    ))}
                    {filtered.length === 0 && (
                      <div
                        style={{
                          textAlign: "center",
                          padding: 32,
                          opacity: 0.5,
                          fontSize: 14,
                        }}
                      >
                        No stocks match the current filters.
                      </div>
                    )}
                  </div>
                </div>
              </>
            )}

            {stocks.length === 0 && (
              <div
                style={{
                  textAlign: "center",
                  padding: "48px 24px",
                  opacity: 0.5,
                  fontSize: 14,
                }}
              >
                Your watchlist is empty. Add a stock above to get started.
              </div>
            )}

            <div
              style={{
                padding: 20,
                textAlign: "center",
                opacity: 0.5,
                fontSize: 11,
                marginTop: 8,
              }}
            >
              Watchlist data is stored locally in your browser. This is for
              personal tracking only — not financial advice.
            </div>
          </div>
        );
      }

      // ─── APP ─────────────────────────────────────────────────────────────────────

      function App() {
        const [activeTab, setActiveTab] = useState("deca");
        const [logoUrl, setLogoUrl] = useState("");

        const tabs = [
          { id: "deca", label: "DECA Recommender" },
          { id: "stocks", label: "Stock Watchlist" },
        ];

        return (
          <div style={containerStyle}>
            <div style={{ maxWidth: 1000, margin: "0 auto", padding: 24 }}>
              <Header
                title={
                  activeTab === "deca"
                    ? "DECA Event Recommender"
                    : "High Return Stock Watchlist"
                }
                subtitle={
                  activeTab === "deca"
                    ? "Answer a few smart questions and get the best-fit DECA events for you."
                    : "Track stocks you believe will outperform — log your thesis and expected returns."
                }
                logoUrl={logoUrl}
              />

              <div
                style={{
                  display: "flex",
                  gap: 4,
                  marginTop: 16,
                  borderBottom: "2px solid #e5e7eb",
                  paddingBottom: 0,
                }}
              >
                {tabs.map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    style={{
                      background: "none",
                      border: "none",
                      borderBottom:
                        activeTab === tab.id
                          ? `3px solid ${SCHOOL_COLORS.primary}`
                          : "3px solid transparent",
                      padding: "10px 18px",
                      cursor: "pointer",
                      fontWeight: activeTab === tab.id ? 800 : 600,
                      color:
                        activeTab === tab.id
                          ? SCHOOL_COLORS.primary
                          : "#6b7280",
                      fontSize: 15,
                      marginBottom: -2,
                      borderRadius: "8px 8px 0 0",
                      transition: "color 0.15s",
                    }}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              {activeTab === "deca" && (
                <DecaTab logoUrl={logoUrl} setLogoUrl={setLogoUrl} />
              )}
              {activeTab === "stocks" && <StockWatchlist />}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
